<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI SOC Demo — RAG over Incident Reports</title>
<style>
  :root {
    --bg: #f5f6fa;
    --panel: #ffffff;
    --border: #e1e4ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2f6feb;
    --accent-bg: #eef3ff;
    --retrieved-bg: #fff8e6;
    --retrieved-border: #f0c96a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  header p code { background: var(--accent-bg); padding: 1px 5px; border-radius: 4px; }

  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 140px;
  }

  .turn { margin-bottom: 22px; }
  .question {
    font-weight: 600;
    margin-bottom: 8px;
    padding: 10px 14px;
    background: var(--accent-bg);
    border-radius: 10px;
    display: inline-block;
  }
  .retrieved {
    background: var(--retrieved-bg);
    border: 1px solid var(--retrieved-border);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 8px 0;
    font-size: 12.5px;
    color: #6b5a1e;
  }
  .retrieved .label { font-weight: 600; margin-bottom: 4px; }
  .retrieved .doc { margin: 3px 0; }
  .retrieved .doc b { color: #4a3d0f; }

  .answer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .answer .label { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 6px; }

  .status { color: var(--muted); font-style: italic; font-size: 13px; }
  .error { color: #b3261e; }

  form {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 10px;
    max-width: 760px;
    margin: 0 auto;
  }
  input[type=text] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>AI SOC Demo — RAG over Incident Reports</h1>
  <p>question &rarr; <code>FAISS</code> semantic search &rarr; <code>llm-d</code> / vLLM (<code>Qwen2.5-0.5B</code>) generates the answer. CPU-only, so each answer takes ~30-90s.</p>
</header>
<main id="chat"></main>
<form id="form">
  <input id="question" type="text" placeholder="e.g. Was there any ransomware activity?" autocomplete="off" />
  <button id="submitBtn" type="submit">Ask</button>
</form>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('question');
const submitBtn = document.getElementById('submitBtn');

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  const turn = el('div', 'turn');
  turn.appendChild(el('div', 'question', question));
  const statusEl = el('div', 'status', 'Searching + generating (this is slow on CPU, hang tight)...');
  turn.appendChild(statusEl);
  chat.appendChild(turn);
  window.scrollTo(0, document.body.scrollHeight);

  input.value = '';
  input.disabled = true;
  submitBtn.disabled = true;

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    statusEl.remove();

    if (!res.ok) {
      turn.appendChild(el('div', 'answer error', 'Error: ' + (data.error || res.status)));
    } else {
      const retrievedBox = el('div', 'retrieved');
      retrievedBox.appendChild(el('div', 'label', 'Retrieved from vector DB (semantic match, not keyword):'));
      data.retrieved.forEach(d => {
        retrievedBox.appendChild(el('div', 'doc',
          `<b>[${d.id}]</b> score=${d.score.toFixed(3)} — ${d.text.slice(0, 100)}...`));
      });
      turn.appendChild(retrievedBox);

      const answerBox = el('div', 'answer');
      answerBox.appendChild(el('div', 'label', 'AI answer (generated, grounded in the docs above):'));
      answerBox.appendChild(document.createTextNode(data.answer));
      turn.appendChild(answerBox);
    }
  } catch (err) {
    statusEl.remove();
    turn.appendChild(el('div', 'answer error', 'Request failed: ' + err.message));
  } finally {
    input.disabled = false;
    submitBtn.disabled = false;
    input.focus();
    window.scrollTo(0, document.body.scrollHeight);
  }
});
</script>
</body>
</html>
